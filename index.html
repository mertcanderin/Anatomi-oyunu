<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3D Keşif ve Sök-Tak Atölyesi</title>

  <!-- PWA & iOS Tam Ekran Etiketleri -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="3D Sök-Tak" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%233b82f6'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='110'>🧩</text></svg>" />

  <link rel="stylesheet" href="./style.css" />

  <!-- Three.js (r160 ES Module Import Map) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D Sahne Canvas Konteyneri -->
  <div id="canvas-container"></div>

  <!-- Konfeti Canvas Katmanı -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Ana Menü Ekranı -->
  <section id="main-menu" class="screen active">
    <div class="menu-header">
      <h1 class="game-title">🧩 3D Sök-Tak Atölyesi</h1>
      <p class="game-subtitle">Bir macera seç ve parçaları yerine yerleştir!</p>
    </div>
    <div id="module-cards" class="cards-grid">
      <!-- modulesData.js'den dinamik olarak oluşturulur -->
    </div>
  </section>

  <!-- Oyun İçi Üst Bar ve Alt Bilgi Katmanı (HUD) -->
  <section id="game-hud" class="hud hidden">
    <div class="hud-top">
      <button id="btn-back-menu" class="hud-btn back-btn" aria-label="Ana Menüye Dön">
        ⬅️ Menü
      </button>

      <div class="hud-title-box">
        <span id="hud-module-title">Modül Adı</span>
        <span id="hud-progress" class="progress-pill">0 / 0</span>
      </div>

      <div class="hud-actions">
        <button id="btn-hint" class="hud-btn hint-btn" aria-label="İpucu Göster">
          💡 İpucu
        </button>
        <button id="btn-toggle-sound" class="hud-btn sound-btn" aria-label="Sesi Aç/Kapat">
          🔊
        </button>
        <button id="btn-reset-module" class="hud-btn reset-btn" aria-label="Yeniden Başlat">
          🔄 Yenile
        </button>
      </div>
    </div>

    <!-- Alt Bilgilendirme Alanı (Modeli asla kapatmaz, en altta sabit durur) -->
    <div class="hud-bottom">
      <div id="part-toast" class="part-toast hidden">
        <span id="part-toast-icon" class="toast-icon">✨</span>
        <div class="toast-text">
          <strong id="part-toast-name">Parça Adı</strong>
          <span id="part-toast-desc">Açıklama</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Tebrik / Tamamlama Ekranı -->
  <section id="celebration-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-trophy">🏆</div>
      <h2 id="celebration-title">Harika İş Çıkardın!</h2>
      <p id="celebration-message">Tüm parçaları doğru yerine yerleştirdin!</p>
      <div class="modal-actions">
        <button id="btn-play-again" class="action-btn secondary-btn">🔄 Tekrar Oyna</button>
        <button id="btn-celebration-menu" class="action-btn primary-btn">🏠 Ana Menüye Dön</button>
      </div>
    </div>
  </section>

  <!-- Ana Giriş Noktası -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
